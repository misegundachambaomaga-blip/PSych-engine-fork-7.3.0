name: iOS IPA

on: workflow_dispatch

jobs:
  iOS:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Install Libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install hmm --quiet
          haxelib run hmm install --quiet
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git 1906c4a96f6bb6df66562b3f24c62f4c5bba14a7
          haxelib install hxvlc --quiet

      - name: Compile iOS
        run: haxelib run lime build ios -nosign -D officialBuild -final

      - name: Package IPA
        run: |
          mkdir -p export/release/ios/build/Release-iphoneos/Payload
          cd export/release/ios/build/Release-iphoneos
          mv *.app Payload/
          zip -r PsychEngine.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@main
        with:
          name: PsychEngine-iOS
          path: export/release/ios/build/Release-iphoneos/PsychEngine.ipa
          if-no-files-found: error
