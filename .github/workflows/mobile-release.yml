name: iOS IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iOS:
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4
      - name: Setup Haxelib
        shell: bash
        run: |
          set -e
          haxelib setup ~/haxelib
          haxelib install hmm --quiet
      - name: Install Libraries
        shell: bash
        run: |
          set -e
          haxelib run hmm install --quiet
          # SScript compatible con Psych Engine 0.7.3
          haxelib install SScript 7.7.0 --always --quiet
          # Lua
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git 1906c4a96f6bb6df66562b3f24c62f4c5bba14a7
          # Video
          haxelib install hxvlc --quiet
      - name: Fix SScript Interactive Setup
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          from pathlib import Path
          roots = [
              Path(os.environ["GITHUB_WORKSPACE"]) / ".haxelib",
              Path.home() / "haxelib",
          ]
          # Also inspect paths reported by Haxelib.
          import subprocess
          result = subprocess.run(
              ["haxelib", "path", "SScript"],
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )
          for line in result.stdout.splitlines():
              path = Path(line.strip())
              if path.is_dir():
                  roots.append(path)
          targets = set()
          for root in roots:
              if not root.exists():
                  continue
              if root.is_file() and root.name == "Macro.hx":
                  targets.add(root)
                  continue
              for current, dirs, files in os.walk(root):
                  dirs[:] = [
                      d for d in dirs
                      if d not in {".git", "node_modules"}
                  ]
                  if "Macro.hx" in files:
                      candidate = Path(current) / "Macro.hx"
                      if candidate.parts[-2:] == ("macro", "Macro.hx"):
                          targets.add(candidate)
          old = 'if (["yes", "y"].contains(Sys.stdin().readLine().toLowerCase().trim()))'
          new = 'if (false)'
          changed = 0
          for path in sorted(targets):
              source = path.read_text(errors="replace")
              if old in source:
                  path.write_text(source.replace(old, new, 1))
                  print(f"Patched: {path}")
                  changed += 1
          if changed == 0:
              print("No matching prompt found. Searched files:")
              for path in sorted(targets):
                  print(path)
              raise SystemExit(
                  "Could not patch SScript's interactive setup prompt."
              )
          print(f"Patched {changed} SScript macro file(s).")
          PY
      - name: Verify SScript
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Haxelib libraries ==="
          haxelib list
          echo "=== SScript path ==="
          haxelib path SScript
          echo "=== Verify source and patch ==="
          python3 <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]) / ".haxelib"
          found = False
          for current, dirs, files in os.walk(root):
              if "SScript.hx" in files and Path(current).name == "tea":
                  print("Found SScript:", Path(current) / "SScript.hx")
                  found = True
              if "Macro.hx" in files and Path(current).name == "macro":
                  path = Path(current) / "Macro.hx"
                  source = path.read_text(errors="replace")
                  if 'Sys.stdin().readLine()' in source:
                      raise SystemExit(
                          f"Interactive prompt still present: {path}"
                      )
                  if 'if (false)' in source:
                      print("Verified patched macro:", path)
          if not found:
              raise SystemExit(
                  "SScript.hx was not found under the project's .haxelib directory."
              )
          PY
      - name: Install iOS Build Tools
        shell: bash
        run: |
          set -e
          haxelib run lime setup ios
      - name: Compile iOS
        shell: bash
        run: |
          set -euo pipefail
          haxelib run lime build ios -nosign -D officialBuild -final
      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find export/release/ios \
            -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No se encontró el bundle .app."
            find export/release/ios -maxdepth 5 -print || true
            exit 1
          fi
          mkdir -p /tmp/ipa/Payload
          cp -R "$APP_PATH" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -r "$GITHUB_WORKSPACE/PsychEngine.ipa" Payload
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-iOS
          path: PsychEngine.ipa
          if-no-files-found:
