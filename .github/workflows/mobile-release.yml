name: iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iOS:
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Setup Haxelib
        shell: bash
        run: |
          set -e
          haxelib setup ~/haxelib
          haxelib install hmm --quiet

      - name: Install Libraries
        shell: bash
        run: |
          set -e

          # Install project dependencies
          haxelib run hmm install --quiet

          # Remove incompatible SScript versions
          haxelib remove SScript || true

          # Install the version required by Psych Engine 0.7.3
          haxelib install SScript 7.7.0 --always --quiet

          # Required Lua and video libraries
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git 1906c4a96f6bb6df66562b3f24c62f4c5bba14a7
          haxelib install hxvlc --quiet

      - name: Verify SScript
        shell: bash
        run: |
          set -e

          echo "=== Haxelib configuration ==="
          haxelib config

          echo "=== Installed SScript ==="
          haxelib list
          haxelib path SScript

          echo "=== Verify tea.SScript source ==="
          SSPATH="$(haxelib path SScript)"

          FOUND=false
          while IFS= read -r path; do
            [ -d "$path" ] || continue

            if [ -f "$path/tea/SScript.hx" ]; then
              echo "Found: $path/tea/SScript.hx"
              FOUND=true
            fi

            if [ -f "$path/src/tea/SScript.hx" ]; then
              echo "Found: $path/src/tea/SScript.hx"
              FOUND=true
            fi
          done <<< "$SSPATH"

          if [ "$FOUND" != "true" ]; then
            echo "::error::SScript 7.7.0 was installed, but tea.SScript.hx was not found in its Haxelib paths."
            exit 1
          fi

      - name: Install iOS Build Tools
        shell: bash
        run: |
          set -e
          haxelib run lime setup ios

      - name: Compile iOS
        shell: bash
        run: |
          set -e
          haxelib run lime build ios -nosign -D officialBuild -final

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find export/release/ios -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle was generated."
            find export/release/ios -maxdepth 5 -print || true
            exit 1
          fi

          mkdir -p /tmp/ipa/Payload
          cp -R "$APP_PATH" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -r "$GITHUB_WORKSPACE/PsychEngine.ipa" Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-iOS
          path: PsychEngine.ipa
          if-no-files-found: error
