name: iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iOS:
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Setup Haxelib
        shell: bash
        run: |
          set -euo pipefail
          haxelib setup ~/haxelib
          haxelib install hmm --quiet

      - name: Install Libraries
        shell: bash
        run: |
          set -euo pipefail
          haxelib run hmm install --quiet

          haxelib remove SScript || true
          haxelib install SScript 7.7.0 --always --quiet

          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git 1906c4a96f6bb6df66562b3f24c62f4c5bba14a7
          haxelib install hxvlc --quiet

      - name: Fix SScript Setup Prompt
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["GITHUB_WORKSPACE"]) / ".haxelib"
          files = list(root.glob("SScript/**/src/macro/Macro.hx"))

          if not files:
              raise SystemExit("ERROR: SScript Macro.hx not found.")

          patched = 0

          for path in files:
              source = path.read_text()
              old = "Sys.stdin().readLine()"
              new = '"n"'

              if old in source:
                  source = source.replace(old, new)
                  path.write_text(source)
                  patched += 1
                  print(f"Patched interactive prompt: {path}")

          if patched == 0:
              raise SystemExit(
                  "ERROR: Expected SScript input expression was not found."
              )

          print("SScript will use the default settings without prompting.")
          PY

      - name: Verify SScript
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["GITHUB_WORKSPACE"]) / ".haxelib"
          files = list(root.glob("SScript/**/src/macro/Macro.hx"))

          if not files:
              raise SystemExit("ERROR: SScript Macro.hx not found.")

          for path in files:
              source = path.read_text()

              if "Sys.stdin().readLine()" in source:
                  raise SystemExit(
                      f"ERROR: Interactive prompt remains in {path}"
                  )

              print(f"Verified: {path}")
          PY

          haxelib list

      - name: Install iOS Build Tools
        shell: bash
        run: |
          set -euo pipefail
          haxelib run lime setup ios

      - name: Compile iOS
        shell: bash
        run: |
          set -uo pipefail

          set +e
          haxelib run lime build ios -nosign -D officialBuild -final 2>&1 | tee ios-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          echo ""
          echo "========== COMPILATION RESULT =========="
          echo "Exit code: $BUILD_STATUS"
          echo "========== LAST 150 LINES =========="
          tail -n 150 ios-build.log || true

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::iOS compilation failed with exit code $BUILD_STATUS"
            exit "$BUILD_STATUS"
          fi

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find export/release/ios -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle was generated."
            find export/release/ios -maxdepth 6 -print || true
            exit 1
          fi

          echo "App found: $APP_PATH"

          rm -rf /tmp/ipa
          mkdir -p /tmp/ipa/Payload
          cp -R "$APP_PATH" /tmp/ipa/Payload/

          cd /tmp/ipa
          zip -r "$GITHUB_WORKSPACE/PsychEngine.ipa" Payload

          test -s "$GITHUB_WORKSPACE/PsychEngine.ipa"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-iOS
          path: PsychEngine.ipa
          if-no-files-found: error
