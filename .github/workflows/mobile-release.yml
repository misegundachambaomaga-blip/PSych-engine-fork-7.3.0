name: iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iOS:
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hmm --quiet

      - name: Install Libraries
        shell: bash
        run: |
          set -e
          haxelib run hmm install --quiet

          # Psych Engine 0.7.3 requires SScript 7.7.0.
          # Download the archived version and install it through Haxelib.
          python3 - <<'PY'
          import urllib.request
          import json

          api = "https://api.github.com/repos/CCobaltDev/SScript-Archive/contents/archives"
          request = urllib.request.Request(
              api,
              headers={"Accept": "application/vnd.github+json",
                       "User-Agent": "PsychEngine-iOS-Build"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              items = json.load(response)

          for item in items:
              print(item["name"])
          PY

          echo "Checking installed SScript..."
          haxelib list
          haxelib path SScript || true

          echo "Checking for SScript source..."
          find ~/haxelib -type f -path '*/tea/SScript.hx' -print

          # Required Lua and video libraries
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git 1906c4a96f6bb6df66562b3f24c62f4c5bba14a7
          haxelib install hxvlc --quiet

      - name: Verify SScript
        shell: bash
        run: |
          set -e
          SSPATH="$(haxelib path SScript)"
          echo "$SSPATH"

          if ! find ~/haxelib -type f -path '*/tea/SScript.hx' -print -quit | grep -q .; then
            echo "::error::SScript.hx was not found. The installed library does not provide tea.SScript."
            exit 1
          fi

      - name: Install iOS Build Tools
        run: |
          haxelib run lime setup ios

      - name: Compile iOS
        run: |
          haxelib run lime build ios -nosign -D officialBuild -final

      - name: Package IPA
        shell: bash
        run: |
          set -e

          APP_PATH="$(find export/release/ios -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle was generated."
            find export/release/ios -maxdepth 5 -print || true
            exit 1
          fi

          mkdir -p /tmp/ipa/Payload
          cp -R "$APP_PATH" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -r "$GITHUB_WORKSPACE/PsychEngine.ipa" Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-iOS
          path: PsychEngine.ipa
          if-no-files-found: error
